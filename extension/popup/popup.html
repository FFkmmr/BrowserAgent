<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Browser Agent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: #f5f5f5;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }
    
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .status.idle {
      background: #e0e0e0;
      color: #666;
    }
    
    .status.running {
      background: #4caf50;
      color: white;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .task-input {
      margin-bottom: 16px;
    }
    
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      font-family: inherit;
    }
    
    textarea:focus {
      outline: none;
      border-color: #2196f3;
    }
    
    .buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #2196f3;
      color: white;
    }
    
    .btn-primary:hover {
      background: #1976d2;
    }
    
    .btn-danger {
      background: #f44336;
      color: white;
    }
    
    .btn-danger:hover {
      background: #d32f2f;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .info {
      background: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #666;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .info-item:last-child {
      margin-bottom: 0;
    }
    
    .label {
      font-weight: 600;
      color: #333;
    }
    
    .examples {
      margin-top: 16px;
      font-size: 12px;
    }
    
    .examples h3 {
      font-size: 14px;
      margin-bottom: 8px;
      color: #333;
    }
    
    .example-link {
      display: block;
      padding: 8px;
      margin-bottom: 4px;
      background: white;
      border-radius: 4px;
      text-decoration: none;
      color: #2196f3;
      cursor: pointer;
    }
    
    .example-link:hover {
      background: #e3f2fd;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 AI Browser Agent</h1>
    <span class="status idle" id="status">Ожидание</span>
  </div>
  
  <div class="task-input">
    <textarea 
      id="taskInput" 
      placeholder="Опишите задачу на естественном языке...&#10;&#10;Например:&#10;'Открой Wikipedia и найди статью про Python'">
    </textarea>
  </div>
  
  <div class="buttons">
    <button class="btn-primary" id="startBtn">▶️ Запустить</button>
    <button class="btn-danger" id="stopBtn" disabled>⏹️ Остановить</button>
  </div>
  
  <div class="info">
    <div class="info-item">
      <span class="label">Backend:</span>
      <span id="backendStatus">❌ Не подключен</span>
    </div>
    <div class="info-item">
      <span class="label">Текущая задача:</span>
      <span id="currentTask">Нет</span>
    </div>
  </div>
  
  <div class="examples">
    <h3>📋 Примеры задач:</h3>
    <a class="example-link" data-task="Открой Wikipedia (https://wikipedia.org) и найди статью про Artificial Intelligence">
      🔍 Поиск на Wikipedia
    </a>
    <a class="example-link" data-task="Перейди на GitHub (https://github.com) и найди репозитории по AI">
      💻 Поиск на GitHub
    </a>
    <a class="example-link" data-task="Открой Google (https://google.com) и найди информацию про Machine Learning">
      🌐 Поиск в Google
    </a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
